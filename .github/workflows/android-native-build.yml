name: Android Native Build

on:
  push:
    branches:
      - mobile-wrapper
    paths:
      - '.github/workflows/android-native-build.yml'
      - 'android/**'
      - 'mobile/**'
      - 'scripts/**'
      - 'css/**'
      - 'js/**'
      - 'demo.html'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/android-native-build.yml'
      - 'android/**'
      - 'mobile/**'
      - 'scripts/**'
      - 'css/**'
      - 'js/**'
      - 'demo.html'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Validate and compile Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate native project metadata
        run: npm run native:check

      - name: Build and synchronize Android web assets
        run: npm run build && npx cap sync android

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile Android debug APK and app bundle
        working-directory: android
        run: ./gradlew assembleDebug bundleDebug --stacktrace

      - name: Upload Android debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operation-hunt-android-debug
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
            android/app/build/reports/tests/testDebugUnitTest/**
