<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operation Hunt: Addition Regression</title>

  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef3f8;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(18px, 4vw, 48px);
      background: #eef3f8;
    }

    main {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    header,
    section {
      border: 1px solid #cbd5e1;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.09);
    }

    header {
      padding: clamp(20px, 4vw, 34px);
      background: #0b2447;
      color: #ffffff;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 4vw, 2.5rem);
    }

    header p {
      margin: 10px 0 0;
      color: #dcecff;
      line-height: 1.5;
    }

    section {
      margin-top: 18px;
      padding: clamp(18px, 3vw, 28px);
    }

    .regression-summary {
      margin: 0;
      padding: 14px 16px;
      border: 2px solid currentColor;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 900;
    }

    .regression-summary.pass {
      background: #e9f8ef;
      color: #138a4b;
    }

    .regression-summary.fail {
      background: #fdecec;
      color: #c93636;
    }

    ol {
      display: grid;
      gap: 10px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    li {
      padding: 13px 15px;
      border-left: 5px solid currentColor;
      border-radius: 10px;
      background: #f8fafc;
    }

    li.pass {
      color: #138a4b;
    }

    li.fail {
      color: #c93636;
    }

    li strong {
      color: inherit;
    }

    li p {
      margin: 7px 0 0;
      color: #4a5568;
    }

    code {
      padding: 2px 5px;
      border-radius: 5px;
      background: #e2e8f0;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Addition Regression Suite</h1>
      <p>
        This page checks the Operation Hunt addition engine across every supported grid and term configuration.
        A fully green report is required before the subtraction phase begins.
      </p>
    </header>

    <section aria-labelledby="regression-summary">
      <p id="regression-summary" class="regression-summary">Running checks…</p>
      <ol id="regression-results" aria-live="polite"></ol>
    </section>
  </main>

  <script src="js/puzzle-engine.js"></script>
  <script src="js/addition-regression.js"></script>
</body>

</html>
